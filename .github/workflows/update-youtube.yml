name: Update Boneverse playlists

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - ".github/workflows/update-youtube.yml"

permissions:
  contents: write

concurrency:
  group: update-boneverse-playlists
  cancel-in-progress: false

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Fetch both playlists
        run: |
          yt-dlp --flat-playlist --dump-single-json --ignore-errors --no-warnings "https://www.youtube.com/playlist?list=PLpmfMHLDYJMbQMxvlqETjzlrjPa5jQRJe" > movies-source.json
          yt-dlp --flat-playlist --dump-single-json --ignore-errors --no-warnings "https://www.youtube.com/playlist?list=PLpmfMHLDYJMZ5a8D51AIE__QdNxcAVwgS" > trailers-source.json
          python - <<'PY'
          import json

          def read_playlist(path):
              with open(path, encoding="utf-8") as f:
                  source = json.load(f)
              result = []
              seen = set()
              for item in source.get("entries") or []:
                  if not item or not item.get("id") or item["id"] in seen:
                      continue
                  seen.add(item["id"])
                  thumbs = item.get("thumbnails") or []
                  thumb = item.get("thumbnail") or (thumbs[-1].get("url") if thumbs else "")
                  uploaded = item.get("upload_date") or ""
                  date = f"{uploaded[:4]}-{uploaded[4:6]}-{uploaded[6:8]}" if len(uploaded) == 8 else ""
                  result.append({
                      "id": item["id"],
                      "title": item.get("title") or "Untitled video",
                      "date": date,
                      "durationSeconds": item.get("duration") or 0,
                      "thumbnail": thumb or f"https://i.ytimg.com/vi/{item['id']}/hqdefault.jpg"
                  })
              return result

          data = {
              "movies": read_playlist("movies-source.json"),
              "trailers": read_playlist("trailers-source.json")
          }
          with open("videos.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"Saved {len(data['movies'])} movies and {len(data['trailers'])} trailers")
          PY
      - name: Commit updated playlist archive
        run: |
          if git diff --quiet -- videos.json; then
            echo "No playlist changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "Update Boneverse movie and trailer playlists"
            git pull --rebase origin main
            git push
          fi
